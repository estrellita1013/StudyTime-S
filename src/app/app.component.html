<ion-app>

  <!-- MENÚ LATERAL -->
  <ion-menu contentId="main-content" type="overlay">

    <ion-header>
      <ion-toolbar>

        <div class="menu-brand">

          <div class="uapa-logo">
            <img
              src="https://www.uapa.edu.do/wp-content/uploads/2022/06/Logo-azul-UAPA.png"
              alt="UAPA"
            />
          </div>

          <div class="brand-text">
            <strong>StudyTime</strong>
            <span>Gestión del estudio</span>
          </div>

        </div>

      </ion-toolbar>
    </ion-header>

    <ion-content>

      <ion-list>

        <ion-menu-toggle>
          <ion-item button routerLink="/tabs/hoy" lines="none">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Inicio</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/estudiar" lines="none">
            <ion-icon slot="start" name="play-circle-outline"></ion-icon>
            <ion-label>Estudiar</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/materias" lines="none">
            <ion-icon slot="start" name="book-outline"></ion-icon>
            <ion-label>Materias</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/metas" lines="none">
            <ion-icon slot="start" name="trophy-outline"></ion-icon>
            <ion-label>Metas</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/calendario" lines="none">
            <ion-icon slot="start" name="calendar-outline"></ion-icon>
            <ion-label>Calendario</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/estadisticas" lines="none">
            <ion-icon slot="start" name="stats-chart-outline"></ion-icon>
            <ion-label>Estadísticas</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <div class="menu-section-title">
          ORGANIZACIÓN
        </div>

        <ion-menu-toggle>
          <ion-item button routerLink="/historial" lines="none">
            <ion-icon slot="start" name="time-outline"></ion-icon>
            <ion-label>Historial</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/notas" lines="none">
            <ion-icon slot="start" name="document-text-outline"></ion-icon>
            <ion-label>Notas</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <div class="menu-section-title">
          HERRAMIENTAS
        </div>

        <ion-menu-toggle>
          <ion-item button routerLink="/lugares" lines="none">
            <ion-icon slot="start" name="location-outline"></ion-icon>
            <ion-label>Lugares</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle>
          <ion-item button routerLink="/bluetooth" lines="none">
            <ion-icon slot="start" name="bluetooth-outline"></ion-icon>
            <ion-label>Bluetooth</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <div class="menu-section-title">
          CUENTA
        </div>

        <ion-menu-toggle>
          <ion-item button routerLink="/tabs/perfil" lines="none">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-label>Mi perfil</ion-label>
          </ion-item>
        </ion-menu-toggle>

      </ion-list>

    </ion-content>

  </ion-menu>

  <!-- CONTENIDO PRINCIPAL -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
